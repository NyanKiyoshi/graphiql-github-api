name: Run Zizmor
on:
  pull_request:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zizmor
        id: zizmor
        uses: NyanKiyoshi/actions/install-zizmor@fee9d7349ffe06bae3694e1956acf8a00eb572e0 # v1.0.0

      - name: Scan Repo
        env:
          ZIZMOR_EXE: ${{ steps.zizmor.outputs.exe }}
        run: |
          "$ZIZMOR_EXE" --strict-collection ./
