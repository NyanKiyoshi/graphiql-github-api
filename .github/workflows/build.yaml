name: Build
on:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build
        run: |
          make build
