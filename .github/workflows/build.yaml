name: Build
on:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          make build
