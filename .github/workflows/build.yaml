name: Build
on:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build
        run: |
          make build
